version: 0.2

env:
  shell: bash

phases:
  install:
    runtime-versions:
      rust: latest
    commands:
      - rustup update stable
      - rustup default stable
      - rustc --version
  build:
    commands:
      # configure shell so we can use "cargo" command
      - . "$HOME/.cargo/env"
      
      # reference cargo directly
      - cargo --version

      # install cargo-lambda
      - pip3 install --root-user-action=ignore cargo-lambda

      # build the lambda
      - cargo lambda build -p hem --arm64 -r --output-format zip

  post_build:
    commands:
      - echo "Running post_build commands"

artifacts:
  files:
    - target/lambda/hem/bootstrap.zip
  discard-paths: yes

cache:
  paths:
    - '/root/.cargo/registry/**/*'
    - 'hem/target/**/*'
