version: 0.2

phases:
  install:
    runtime-versions:
      rust: latest
    commands:
      - rustup update stable
      - rustup default stable
      - rustc --version

  build:
    commands:
      # configure shell so we can use "cargo" command
      - . "$HOME/.cargo/env"

      # enter directory for fhs-lambda, make hem & fhs sources available
      - cd crates/fhs-monolith
      - ln -sfn "${CODEBUILD_SRC_DIR_hem_core_source_output}" hem

      # run hem core tests
      - (cd hem && cargo test --lib && cargo test --test e2e -- --nocapture)

cache:
  paths:
    - "/root/.cargo/registry/**/*"
