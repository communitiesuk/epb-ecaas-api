[package]
name = "fhs-common"
version = "0.1.0"
edition = "2024"

[dependencies]
aws-config = "1.13.4"
aws-sdk-dynamodb = "1.141.0"
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde"] }
enum-assoc = "1.3.0"
home-energy-model-wrapper-fhs = { git = "https://github.com/communitiesuk/epb-hem-wrapper-fhs", branch = "1_0_0a9" }
json-pointer = "0.3.4"
lambda_http = { version = "1.3.2", default-features = false, features = ["apigw_rest", "apigw_http", "tracing"] }
resolve-products = { git = "https://github.com/communitiesuk/epb-ecaas-pcdb.git", branch = "1_0_0a9" }
sentry = "0.49.6"
serde = "1.0.229"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
serde_with = "3.25.0"
tokio = { version = "1", features = ["macros"] }
uuid = { version = "1.29.3", features = ["v4", "serde"] }
url = { version = "2.5.9", features = ["serde"] }