[package]
name = "ecaas-api-fhs-monolith-lambda"
version = "0.1.0"
edition = "2024"

[dependencies]
fhs-common = { workspace = true }
home-energy-model-wrapper-fhs = { git = "https://github.com/communitiesuk/epb-hem-wrapper-fhs", branch = "1_0_0a9" }
lambda-common = { workspace = true }
lambda_http = { version = "1.3.0", default-features = false, features = ["apigw_rest", "apigw_http"] }
openssl = { version = "0.10.82", features = ["vendored"] }
# resolve directly from github for now
resolve-products = { git = "https://github.com/communitiesuk/epb-ecaas-pcdb.git", branch = "1_0_0a9" }
serde_json = { version = "1.0.145", features = ["preserve_order"] }
tokio = { version = "1", features = ["macros"] }

[profile.release]
# keep line numbers for logs, but remove heavy variable/type data
debug = 1
# adopt unwind behaviour for panics for now (remove when we have no more panics!)
panic = "unwind"
# optimise for binary size
opt-level = 3
# enable link-time optimisation
lto = true
# use a single thread for code generation - allows maximum optimisation visibility
codegen-units = 1

[[bin]]
name = "fhs-monolith"
path = "src/main.rs"

[lints.rust]
linker_messages = "allow"
